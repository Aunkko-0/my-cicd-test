# .github/workflows/main.yml

name: Python CI Pipeline # ชื่อสายพานของเรา

# "Trigger": สั่งให้ทำงาน "เมื่อ" มีการ push โค้ด
on: [push]

# "Jobs": งานที่จะต้องทำ
jobs:
  build-and-test: # ชื่องาน
    # "Runner": สั่งให้ไปทำงานบนเครื่องเซิร์ฟเวอร์ (ฟรี) ที่เป็น Ubuntu
    runs-on: ubuntu-latest

    # "Steps": ขั้นตอนที่จะทำ (ทำทีละขั้นจากบนลงล่าง)
    steps:
      # 1. เช็คเอาท์โค้ด (โหลดโค้ดของเราไปที่ Runner)
      - name: Check out repository code
        uses: actions/checkout@v4

      # 2. ติดตั้ง Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 3. ติดตั้ง Dependencies (ในที่นี้คือ pytest สำหรับ test)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      # 4. รัน Test! (นี่คือ CI - Continuous Integration)
      - name: Run Pytest
        run: pytest test_app.py